<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Min Pokémon Samling (Cloud Sync)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Samma snygga design som tidigare */
        body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        header { text-align: center; border-bottom: 2px solid #3b4cca; margin-bottom: 20px; }
        .tracker { background: #ffde00; padding: 10px; border-radius: 5px; display: inline-block; margin: 10px 0; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        img { width: 50px; }
        .comment-input { width: 90%; padding: 5px; }
        #searchInput { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Pokémon Cloud Tracker</h1>
        <div class="tracker" id="trackerDisplay">Ansluter till databas...</div>
        <input type="text" id="searchInput" placeholder="Sök namn eller nummer...">
    </header>

    <table id="pokeTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Bild</th>
                <th>Namn</th>
                <th>Äger</th>
                <th>Kommentar</th>
            </tr>
        </thead>
        <tbody id="pokeList"></tbody>
    </table>
</div>

<script>
    // --- KONFIGURATION (Fyll i dina uppgifter här!) ---
    const SUPABASE_URL = 'https://socixgiusmrnejuyeyha.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uHVRcWZxwpZT1O7DokUHEw_nnhx9gMt';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TOTAL_POKEMON = 493;
    let cloudData = {};

    async function init() {
        // 1. Hämta data från Supabase
        const { data, error } = await supabase.from('pokemon_collection').select('*');
        
        if (error) {
            console.error("Fel vid hämtning:", error);
        } else {
            // Gör om listan från Supabase till ett smidigt objekt
            data.forEach(item => {
                cloudData[item.pokemon_id] = item;
            });
        }

        // 2. Hämta Pokémon-namn från PokéAPI
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon?limit=${TOTAL_POKEMON}`);
        const pokeData = await response.json();
        
        renderTable(pokeData.results);
        updateTracker();
    }

    function renderTable(pokemons) {
        const pokeList = document.getElementById('pokeList');
        let html = '';
        
        pokemons.forEach((pokemon, index) => {
            const id = index + 1;
            const isChecked = cloudData[id]?.owned ? 'checked' : '';
            const comment = cloudData[id]?.comment || '';
            const name = pokemon.name.charAt(0).toUpperCase() + pokemon.name.slice(1);
            const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;

            html += `
                <tr class="poke-row" data-name="${name.toLowerCase()}" data-id="${id}">
                    <td>#${id}</td>
                    <td><img src="${imgUrl}" loading="lazy"></td>
                    <td><strong>${name}</strong></td>
                    <td><input type="checkbox" onchange="updatePokemon(${id}, 'owned', this.checked)" ${isChecked}></td>
                    <td><input type="text" class="comment-input" value="${comment}" onchange="updatePokemon(${id}, 'comment', this.value)"></td>
                </tr>
            `;
        });
        pokeList.innerHTML = html;
    }

    // Funktion som pratar med Supabase
    async function updatePokemon(id, field, value) {
        const updateObj = { pokemon_id: id };
        updateObj[field] = value;

        // "Upsert" betyder: Uppdatera om den finns, annars skapa ny rad
        const { error } = await supabase
            .from('pokemon_collection')
            .upsert(updateObj, { onConflict: 'pokemon_id' });

        if (error) console.error("Kunde inte spara:", error);
        
        cloudData[id] = { ...cloudData[id], ...updateObj };
        updateTracker();
    }

    function updateTracker() {
        let count = 0;
        for (let id in cloudData) {
            if (cloudData[id].owned) count++;
        }
        document.getElementById('trackerDisplay').textContent = `Du har samlat ${count} av ${TOTAL_POKEMON}`;
    }

    // Sökfunktion
    document.getElementById('searchInput').addEventListener('keyup', (e) => {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.poke-row').forEach(row => {
            const match = row.getAttribute('data-name').includes(term) || row.getAttribute('data-id').includes(term);
            row.style.display = match ? '' : 'none';
        });
    });

    init();
</script>
</body>
</html>
